<!DOCTYPE html>
<html lang=""en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple 4x4 HTML Table</title>

<style>
  table {
        width: 100%;
        border-collapse: collapse;
        font-family: Arial, sans-serif;
        margin-top: 20px;
  }
  th {
          border: 4px solid #070707;
          padding: 12px;
          text-align: bottom;
          
  }
  td {
          border: 4px solid #070707;
          padding: 20px;
          text-align: left;
          
  }
  th {
      background-color: light rgb(159, 48, 126);
      color: rgb(254, 2, 2);
      font-weight: bold;
  }
</style>
</head>
<body>

  <h2>Sample 4x4 Table :</h2>

  <table>
    
    <tr>
      <th>SI.NO</th>
      <th>MATHS(100)</th>
      <th>PHYSICS(100)</th>
      <th>CHEMISTRY(100)</th>
    </tr>

    <tr>
      <td>STUDENT_1</td>
      <td>60</td>
      <td>70</td>
      <td>90</td>
    </tr>

    <tr>
      <td>STUDENT_2</td>
      <td>70</td>
      <td>90</td>
      <td>80</td>
    </tr>

    <tr>
      <td>STUDENT_3</td>
      <td>80</td>
      <td>95</td>
      <td>85</td>
    </tr>
  </table>
</body>
</html>
